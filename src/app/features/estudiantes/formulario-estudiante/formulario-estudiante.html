@if (noEncontrado) {
  <div class="rounded-xl border border-amber-200 bg-amber-50 px-6 py-10 text-center">
    <p class="font-semibold text-amber-900">Estudiante no encontrado</p>
    <a routerLink="/estudiantes" class="mt-4 inline-block text-sm font-medium text-indigo-700 hover:underline">
      Volver al listado
    </a>
  </div>
} @else {
  <form
    [formGroup]="form"
    (ngSubmit)="guardar()"
    class="mx-auto max-w-2xl space-y-5 rounded-xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <div>
      <h3 class="text-lg font-semibold text-slate-900">
        {{ esEdicion() ? 'Editar estudiante' : 'Registrar estudiante' }}
      </h3>
      <p class="mt-1 text-sm text-slate-500">
        Formulario reactivo con validaciones de Angular.
      </p>
    </div>

    <label class="block">
      <span class="mb-1.5 block text-sm font-medium text-slate-700">Nombre</span>
      <input
        formControlName="nombre"
        type="text"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-indigo-500 focus:ring-2"
      />
      @if (campoInvalido('nombre')) {
        <p class="mt-1 text-xs text-rose-600">El nombre es obligatorio (mínimo 3 caracteres).</p>
      }
    </label>

    <label class="block">
      <span class="mb-1.5 block text-sm font-medium text-slate-700">Correo</span>
      <input
        formControlName="correo"
        type="email"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-indigo-500 focus:ring-2"
      />
      @if (campoInvalido('correo')) {
        <p class="mt-1 text-xs text-rose-600">Ingresa un correo válido.</p>
      }
    </label>

    <label class="block">
      <span class="mb-1.5 block text-sm font-medium text-slate-700">Carrera</span>
      <input
        formControlName="carrera"
        type="text"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-indigo-500 focus:ring-2"
      />
      @if (campoInvalido('carrera')) {
        <p class="mt-1 text-xs text-rose-600">La carrera es obligatoria.</p>
      }
    </label>

    <div class="grid gap-4 sm:grid-cols-3">
      <label class="block">
        <span class="mb-1.5 block text-sm font-medium text-slate-700">Estado</span>
        <select
          formControlName="estado"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-indigo-500 focus:ring-2"
        >
          <option value="activo">Activo</option>
          <option value="inactivo">Inactivo</option>
          <option value="egresado">Egresado</option>
        </select>
      </label>

      <label class="block">
        <span class="mb-1.5 block text-sm font-medium text-slate-700">Fecha de ingreso</span>
        <input
          formControlName="fechaIngreso"
          type="date"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-indigo-500 focus:ring-2"
        />
      </label>

      <label class="block">
        <span class="mb-1.5 block text-sm font-medium text-slate-700">Promedio</span>
        <input
          formControlName="promedio"
          type="number"
          step="0.1"
          min="0"
          max="10"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-indigo-500 focus:ring-2"
        />
        @if (campoInvalido('promedio')) {
          <p class="mt-1 text-xs text-rose-600">Debe estar entre 0 y 10.</p>
        }
      </label>
    </div>

    <div class="flex flex-wrap gap-3 pt-2">
      <button
        type="submit"
        class="rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700"
      >
        {{ esEdicion() ? 'Guardar cambios' : 'Crear estudiante' }}
      </button>
      <a
        routerLink="/estudiantes"
        class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50"
      >
        Cancelar
      </a>
    </div>
  </form>
}
