<td class="px-4 py-3 font-medium text-slate-900">
  <a [routerLink]="['/estudiantes', estudiante().id]" class="hover:text-indigo-700">
    {{ estudiante().nombre }}
  </a>
</td>
<td class="hidden px-4 py-3 text-slate-600 md:table-cell">{{ estudiante().correo }}</td>
<td class="px-4 py-3 text-slate-600">{{ estudiante().carrera }}</td>
<td class="px-4 py-3">
  <span class="inline-flex rounded-full px-2.5 py-1 text-xs font-semibold" [class]="claseEstado()">
    {{ estudiante().estado | estado }}
  </span>
</td>
<td class="hidden px-4 py-3 text-slate-600 lg:table-cell">
  {{ estudiante().fechaIngreso | date: 'd MMM y' : undefined : 'es' }}
</td>
<td class="px-4 py-3 text-slate-600">{{ estudiante().promedio | number: '1.1-1' }}</td>
<td class="px-4 py-3">
  <div class="flex flex-wrap gap-2">
    <a
      [routerLink]="['/estudiantes', estudiante().id]"
      class="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-700 hover:bg-slate-200"
    >
      Ver
    </a>
    <a
      [routerLink]="['/estudiantes', estudiante().id, 'editar']"
      class="rounded-md bg-indigo-50 px-2.5 py-1 text-xs font-medium text-indigo-700 hover:bg-indigo-100"
    >
      Editar
    </a>
    <button
      type="button"
      (click)="solicitarEliminar()"
      class="rounded-md bg-rose-50 px-2.5 py-1 text-xs font-medium text-rose-700 hover:bg-rose-100"
    >
      Eliminar
    </button>
  </div>
</td>
